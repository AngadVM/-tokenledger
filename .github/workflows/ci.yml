name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://tokenledger:tokenledger@localhost:5432/tokenledger?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-secret-0123456789abcdef
  ADMIN_EMAIL: admin@tokenledger.dev
  ADMIN_PASSWORD: ci-admin-password-123
  UPSTREAM_BASE_URL: http://localhost:9999/v1
  UPSTREAM_API_KEY: dummy

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokenledger
          POSTGRES_PASSWORD: tokenledger
          POSTGRES_DB: tokenledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenledger -d tokenledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - run: npm run test:integration